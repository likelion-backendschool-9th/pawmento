name: CI

# develop·main으로 가는 PR과 develop push(머지)에서 돈다. main은 PR에서 이미 검사하므로 push에서는 돌지 않는다.
# develop push에서는 검사를 통과하면 이미지를 GHCR에 올리고 개발 서버에 배포한다.
# main(운영 서버, 나중에 클라우드)은 아직 배포하지 않는다.
# 필수 검사로 지정하므로 경로 필터를 걸지 않는다. 걸면 해당 경로를 안 건드린 PR에서 검사가 "대기 중"으로 남는다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다. develop push는 취소하지 않고 순서대로 돈다 (배포가 붙으면 순서가 중요하다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend lint·build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  # ---- 개발 서버 배포 (develop push에서만) ----

  # 검사를 통과하면 이미지를 만들어 GHCR에 올린다
  build-push:
    name: Build·push image (${{ matrix.service }})
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN으로 GHCR에 이미지를 올린다
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그: sha-<커밋 7자리>(배포·되돌리기용), latest(가장 최근 이미지)
      # 라벨 org.opencontainers.image.source(저장소 주소)가 붙어, 서버에서 우리 이미지만 골라 정리할 수 있다
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pawmento-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 서버에 SSH로 들어가 새 이미지로 다시 띄운다
  # 접속 정보는 GitHub 환경 develop의 Secrets에 둔다: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (포트가 22가 아니면 DEPLOY_PORT)
  # 서버에는 ~/pawmento에 저장소를 develop 브랜치로 clone하고 .env를 둔다 (.env.develop.example 참고)
  # 앱 비밀값(DB 비밀번호 등)은 Secrets에 두지 않고 서버 .env에만 둔다
  deploy:
    name: Deploy to develop server
    needs: build-push
    runs-on: ubuntu-latest
    # Actions 화면에 배포 이력이 남는다
    environment: develop
    steps:
      # 서버 준비 전에는 접속 정보가 없으므로 배포를 건너뛴다 (워크플로는 실패로 표시하지 않음)
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST가 없어 배포를 건너뜁니다"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # build-push가 붙인 sha-<커밋 7자리> 태그와 같은 값을 만든다
      - name: Set IMAGE_TAG
        if: steps.check.outputs.ready == 'true'
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 서드파티 액션이라 태그 대신 커밋 SHA로 고정한다 (v1.2.5)
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        if: steps.check.outputs.ready == 'true'
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,REPO_URL
          script: |
            set -e
            cd ~/pawmento
            # compose.develop.yaml, nginx 설정을 최신으로 맞춘다
            git pull --ff-only
            docker compose -f compose.develop.yaml pull
            docker compose -f compose.develop.yaml up -d --no-build
            # 다른 팀도 쓰는 서버라 우리 저장소에서 만든 이미지만 정리한다
            docker image prune -f --filter "label=org.opencontainers.image.source=$REPO_URL"
            docker compose -f compose.develop.yaml ps
            # 팀 포트가 응답할 때까지 최대 30초 기다린다 (127.0.0.1에만 열려 있으므로 IP로 확인)
            TEAM_PORT=$(grep -E '^TEAM_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 10); do
              curl -fsS -o /dev/null "http://127.0.0.1:$TEAM_PORT" && exit 0
              sleep 3
            done
            echo "$TEAM_PORT 응답 없음"
            exit 1
