name: CI

# develop·main으로 가는 PR과 develop push(머지)에서 돈다. main은 PR에서 이미 검사하므로 push에서는 돌지 않는다.
# develop push에서는 검사를 통과하면 이미지를 GHCR에 올리고 개발 서버에 배포한다.
# main(운영 서버, 나중에 클라우드)은 아직 배포하지 않는다.
# 필수 검사로 지정하므로 경로 필터를 걸지 않는다. 걸면 해당 경로를 안 건드린 PR에서 검사가 "대기 중"으로 남는다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다. develop push는 취소하지 않고 순서대로 돈다 (배포가 붙으면 순서가 중요하다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend lint·build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg util-linux
      - run: ./gradlew test

  # ---- 개발 서버 배포 (develop push에서만) ----

  # 검사를 통과하면 이미지를 만들어 GHCR에 올린다
  build-push:
    name: Build·push image (${{ matrix.service }})
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN으로 GHCR에 이미지를 올린다
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그: sha-<커밋 7자리>(배포·되돌리기용), latest(가장 최근 이미지)
      # 라벨 org.opencontainers.image.source(저장소 주소)가 붙어, 서버에서 우리 이미지만 골라 정리할 수 있다
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pawmento-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 서버에 SSH로 들어가 새 이미지로 다시 띄운다
  # 접속 정보는 GitHub 환경 develop의 Secrets에 둔다: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (포트가 22가 아니면 DEPLOY_PORT)
  # 서버에는 ~/pawmento/.env만 미리 둔다 (.env.prod.example 참고). compose 파일과 nginx 설정은 배포 때 복사한다
  # 앱 비밀값(DB 비밀번호 등)은 Secrets에 두지 않고 서버 .env에만 둔다
  deploy:
    name: Deploy to develop server
    needs: build-push
    runs-on: ubuntu-latest
    # Actions 화면에 배포 이력이 남는다
    environment: develop
    steps:
      # 서버 준비 전에는 접속 정보가 없으므로 배포를 건너뛴다 (워크플로는 실패로 표시하지 않음)
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST가 없어 배포를 건너뜁니다"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # build-push가 붙인 sha-<커밋 7자리> 태그와 같은 값을 만든다
      - name: Set IMAGE_TAG
        if: steps.check.outputs.ready == 'true'
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 서버에 둘 파일(compose 파일, 팀 nginx 설정)을 이 커밋 그대로 복사한다. 이미지와 설정이 항상 같은 커밋에서 온다
      # 서버의 .env는 덮어쓰지 않는다 (rm을 켜면 .env까지 지워지므로 켜지 않는다)
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'

      # 서드파티 액션이라 태그 대신 커밋 SHA로 고정한다 (v1.0.0)
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        if: steps.check.outputs.ready == 'true'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 서버 호스트 키 확인. 비어 있으면 확인을 건너뛴다 (아래 ssh 단계와 같은 값)
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: compose.yaml,compose.prod.yaml,nginx/proxy.conf
          target: ~/pawmento
          overwrite: true

      # 서드파티 액션이라 태그 대신 커밋 SHA로 고정한다 (v1.2.5)
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        if: steps.check.outputs.ready == 'true'
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 서버 호스트 키의 SHA256 지문. 두 액션(Go SSH)은 ECDSA 키를 ED25519보다 먼저 고르므로
          # 서버에서 ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub 의 SHA256:... 값을 넣는다 (ECDSA 키가 없으면 rsa, 그다음 ed25519)
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: IMAGE_TAG,REPO_URL
          script: |
            set -e
            cd ~/pawmento
            # .env는 서버에서 직접 만든다 (.env.prod.example 참고). 없으면 어떤 파일이 빠졌는지 알리고 멈춘다
            test -f .env || { echo "~/pawmento/.env가 없습니다"; exit 1; }
            # 로컬용 compose.override.yaml은 읽지 않는다
            COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"
            $COMPOSE pull
            $COMPOSE up -d --no-build
            # 다른 팀도 쓰는 서버라 우리 저장소에서 만든 이미지만 정리한다
            # -a: 태그가 남은 이전 버전(sha-...)도 지운다. 실행 중인 컨테이너의 이미지는 남는다
            # 되돌릴 때는 up -d가 GHCR에서 다시 받는다
            docker image prune -a -f --filter "label=org.opencontainers.image.source=$REPO_URL"
            $COMPOSE ps
            # 프론트엔드와 백엔드가 모두 응답할 때까지 최대 90초 기다린다 (127.0.0.1에만 열려 있으므로 IP로 확인)
            # - 프론트엔드: / 가 2xx·3xx
            # - 백엔드: /api/v1/ 이 nginx 오류(502·503·504)나 연결 실패(000)가 아니면 통과. 로그인 없는 요청이라 보통 401
            TEAM_PORT=$(grep -E '^TEAM_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 30); do
              web=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$TEAM_PORT/" || true)
              api=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$TEAM_PORT/api/v1/" || true)
              case "$web" in 2??|3??) web_ok=1 ;; *) web_ok=0 ;; esac
              case "$api" in 000|502|503|504) api_ok=0 ;; *) api_ok=1 ;; esac
              if [ "$web_ok" = 1 ] && [ "$api_ok" = 1 ]; then
                echo "배포 확인: 프론트엔드 $web, 백엔드 $api"
                exit 0
              fi
              sleep 3
            done
            # 로그는 공개 저장소의 Actions 화면에 남으므로 출력하지 않는다. 서버에서 docker compose logs backend로 확인한다
            echo "응답 확인 실패: 프론트엔드 $web, 백엔드 $api"
            $COMPOSE ps
            exit 1
