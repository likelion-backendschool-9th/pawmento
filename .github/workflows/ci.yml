name: CI

# develop·main으로 가는 PR과 develop push(머지)에서 돈다. main은 PR에서 이미 검사하므로 push에서는 돌지 않는다.
# 필수 검사로 지정하므로 경로 필터를 걸지 않는다. 걸면 해당 경로를 안 건드린 PR에서 검사가 "대기 중"으로 남는다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다. develop push는 취소하지 않고 순서대로 돈다 (배포가 붙으면 순서가 중요하다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend lint·build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
