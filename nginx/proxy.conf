# 팀 nginx 설정. compose.yaml의 nginx 서비스가 쓴다 (로컬·서버 공통)
#
# 서버: 인터넷 → 호스트 nginx (팀 도메인, HTTPS)
#             → http://127.0.0.1:${TEAM_PORT} (이 nginx, 80)
#             → /api/ 는 backend:8080, 나머지는 frontend:3000
# 로컬: http://localhost:8000 (이 nginx) → 같은 경로 규칙
#
# HTTPS는 호스트 nginx가 처리하므로 여기는 80만 듣는다
# 호스트 nginx가 넘겨 준 X-Forwarded-* 헤더를 그대로 전달한다 (로컬에서는 비어 있다)

# 재배포로 컨테이너 IP가 바뀌어도 따라가도록 Docker 내부 DNS로 이름을 10초마다 다시 찾는다
# 대상이 아직 안 떠 있어도 nginx는 종료되지 않고 그동안만 502를 준다
resolver 127.0.0.11 valid=10s;

# 접근 로그에는 요청 경로만 남기고 쿼리 문자열(? 뒤)은 남기지 않는다 (#262)
# 장소 검색어(#195)와 지도 영역·좌표(#172)는 GET 주소의 쿼리 문자열로 오가는데, 사용자가 입력한 값이라 로그에 남기지 않는다
# 기본 형식(combined)에서 $request를 $request_method $uri $server_protocol로 바꾸고, 주소(쿼리 포함)가 담길 수 있는 $http_referer를 뺐다
log_format pawmento_no_query '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                             '"$http_user_agent"';

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

server {
    listen 80;
    server_name _;

    # nginx 이미지는 이 파일을 표준 출력으로 보내므로 docker logs로 그대로 본다
    access_log /var/log/nginx/access.log pawmento_no_query;

    # 사진 업로드를 받을 수 있게 기본값(1m)보다 크게 둔다. 사진은 한 요청에 한 장, 최대 15MB라(#4, docs/deploy.md) 여유를 둔 값이다
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $http_x_real_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;

    location /api/ {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}
