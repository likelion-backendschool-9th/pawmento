# 개발 서버의 팀 nginx 설정 (compose.develop.yaml의 nginx 서비스가 쓴다)
#
# 인터넷 → 서버 nginx (팀 도메인, HTTPS)
#        → http://127.0.0.1:${TEAM_PORT} (이 nginx, 80)
#        → /api/ 는 backend:8080, 나머지는 frontend:3000
#
# HTTPS는 서버 nginx가 처리하므로 여기는 80만 듣는다
# 서버 nginx가 넘겨 준 X-Forwarded-* 헤더를 그대로 전달한다

# 재배포로 컨테이너 IP가 바뀌어도 따라가도록 Docker 내부 DNS로 이름을 10초마다 다시 찾는다
# 대상이 아직 안 떠 있어도 nginx는 종료되지 않고 그동안만 502를 준다
resolver 127.0.0.11 valid=10s;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

server {
    listen 80;
    server_name _;

    # 사진 업로드를 받을 수 있게 기본값(1m)보다 크게 둔다. 사진 저장 방식이 정해지면(#4) 함께 맞춘다
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $http_x_real_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;

    location /api/ {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}
