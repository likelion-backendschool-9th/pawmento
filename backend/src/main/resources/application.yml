spring:
  servlet:
    multipart:
      max-file-size: 15728640B
      max-request-size: 16777216B
      file-size-threshold: 0B
      location: ${PAWMENTO_MEDIA_ROOT:./.local/media}/tmp/multipart
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # 메일 서버가 응답하지 않아도 요청이 오래 붙잡히지 않게 5초에서 끊는다
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: backend
  # 로컬 실행(bootRun)에서는 compose.yaml의 DB가 자동으로 연결된다. 앱을 꺼도 DB는 켜 둔다.
  # 배포 환경에서는 SPRING_DATASOURCE_URL·SPRING_DATASOURCE_USERNAME·SPRING_DATASOURCE_PASSWORD 환경 변수로 넘긴다.
  docker:
    compose:
      lifecycle-management: start-only
  jpa:
    hibernate:
      # 임시. 엔티티에 맞춰 테이블을 만들고 컬럼을 더한다(데이터는 지우지 않는다).
      # 스키마 관리 방식(ddl-auto, Flyway 등)은 백엔드 구조 작업에서 정한다 (docs/member/README.md)
      ddl-auto: update
      # 컬럼·테이블 이름은 필드명을 snake_case로 바꿔 쓴다(PostgreSQL 관례). 엔티티에서 @Column(name)은 쓰지 않는다.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

pawmento:
  media:
    root: ${PAWMENTO_MEDIA_ROOT:./.local/media}
  postcard:
    # 베타 기간 표시와 하루 제한. 결제 상황에 따라 코드 변경 없이 바꾼다 (docs/postcard/generate.md)
    beta: ${PAWMENTO_POSTCARD_BETA:true}
    daily-limit-per-member: ${PAWMENTO_POSTCARD_DAILY_LIMIT_PER_MEMBER:3}
    # 팀 전체 하루 상한. 키 유출이나 버그로 요청이 몰릴 때 비용을 막는다
    daily-limit-total: ${PAWMENTO_POSTCARD_DAILY_LIMIT_TOTAL:100}
    # 그림 생성기. fake는 외부 AI 없이 바탕 그림을 만든다(로컬·테스트 기본값).
    # cloudflare는 Workers AI로 그린다. 계정 ID와 토큰이 없으면 시작하지 않는다
    generator: ${PAWMENTO_POSTCARD_GENERATOR:fake}
    cloudflare:
      # 저장소에 두지 않고 환경 변수로만 받는다. 토큰은 Workers AI 권한만 준다
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_AI_TOKEN:}
      # S7에서 flux-2-klein-9b와 비교해 4b로 정했다 (docs/postcard/generate.md)
      model: "${PAWMENTO_POSTCARD_CLOUDFLARE_MODEL:@cf/black-forest-labs/flux-2-klein-4b}"
    # 완성 이미지(images/)와 요청 때 복사한 사진(sources/)
    image-root: ${PAWMENTO_MEDIA_ROOT:./.local/media}/postcards
  mail:
    # 인증번호 메일의 보내는 사람. 비우면 로그인한 메일 주소로 보낸다
    from: ${PAWMENTO_MAIL_FROM:${SPRING_MAIL_USERNAME:no-reply@pawmento.local}}
  auth:
    # JWT 서명 키. 32바이트 이상. 저장소에 두지 않고 환경 변수 JWT_SECRET으로만 받는다.
    # 비어 있으면 시작할 때 임시 키를 만든다(재시작하면 로그인이 풀린다). 개발 서버·운영 서버에서는 반드시 설정한다.
    jwt-secret: ${JWT_SECRET:}
    # 액세스 토큰과 쿠키의 유효 시간
    access-token-ttl: 1h
  map:
    naver:
      # 네이버 클라우드 플랫폼 Maps 애플리케이션 키. 저장소에 두지 않고 환경 변수로만 받는다.
      # 비어 있으면 주소 조회를 건너뛴다(저장은 주소 없이 이어간다)
      client-id: ${NAVER_MAP_CLIENT_ID:}
      client-secret: ${NAVER_MAP_CLIENT_SECRET:}
    public-data:
      # 공공데이터포털 일반 인증키(병원·미용 인허가와 보호센터 조회에 함께 쓴다). 저장소에 두지 않고 환경 변수로만 받는다.
      # 비어 있으면 가져오기만 중단된다(저장된 장소는 그대로 둔다)
      service-key: ${PUBLIC_DATA_SERVICE_KEY:}
      sync:
        # 병원·미용은 매일, 보호센터는 매주 자동 가져오기(인증키가 있을 때만 켜진다). 정부 서버는 한 번 받는 데 1~몇 분 걸리고 가끔 시간 초과가 나서,
        # 실패하면 retry-delay 뒤에 max-retries번까지 다시 시도한다. cron은 한국 시간 새벽 4시 30분
        enabled: true
        cron: "0 30 4 * * *"
        # 보호센터는 바뀌는 일이 드물어 매주 월요일 새벽 4시 50분
        shelter-cron: "0 50 4 * * MON"
        retry-delay: 30m
        max-retries: 3

  oauth:
    google:
      # Google Cloud Console OAuth 클라이언트. 저장소에 두지 않고 환경 변수로만 받는다.
      # 비어 있으면 앱은 켜지고 구글 로그인만 실패한다
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      # 카카오 디벨로퍼스 > 앱 키 > REST API 키. client-secret은 콘솔에서 Client Secret을 켰을 때만 넣는다
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}