# 로컬 개발용 서비스. 저장소 루트에서 `docker compose up -d`로 실행한다.
# 접속 정보는 .env에서 읽는다. 처음에는 .env.example을 .env로 복사한다.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME을 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?.env에 DB_USERNAME을 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}
    ports:
      - "${DB_PORT:?.env에 DB_PORT를 설정하세요}:5432"
    volumes:
      # postgres 18부터 데이터 위치가 /var/lib/postgresql/<버전>/docker로 바뀌어 상위 폴더를 마운트한다
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
