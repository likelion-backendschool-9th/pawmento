# 개발 서버용. develop에 머지하면 배포 워크플로가 서버에서 아래처럼 실행한다
#   docker compose -f compose.develop.yaml pull
#   docker compose -f compose.develop.yaml up -d --no-build
# 로컬 개발용 DB는 backend/compose.yaml이다 (bootRun이 자동으로 띄움). 이 파일은 로컬에서 쓰지 않는다
#
# 빌드하지 않고 GHCR에 올라간 이미지로 띄운다. 서버에는 이 파일, nginx/develop.conf, .env만 있으면 된다
# 값은 같은 폴더의 .env에서 읽는다 (.env.develop.example 참고). 빠진 값이 있으면 :? 검사로 어떤 값인지 알려 주고 멈춘다
#
# 다른 팀과 함께 쓰는 공용 서버다
# - COMPOSE_PROJECT_NAME으로 네트워크·볼륨 이름을 팀별로 나눈다
# - container_name은 두지 않는다. 컨테이너 이름은 <COMPOSE_PROJECT_NAME>-<서비스>-<번호>로 붙는다
# - 밖으로 여는 포트는 팀에 배정된 TEAM_PORT 하나뿐이고, 127.0.0.1에만 연다. 서버의 nginx가 도메인으로 연결한다

services:
  db:
    # backend/compose.yaml, Testcontainers와 같은 버전을 쓴다
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      # postgres 18부터 데이터 위치가 /var/lib/postgresql/<버전>/docker로 바뀌어 상위 폴더를 마운트한다
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # IMAGE_TAG로 배포할 버전(sha-<커밋 7자리>)을 고른다. 이전 태그로 바꾸면 되돌릴 수 있다
    image: ghcr.io/${GITHUB_OWNER:?GITHUB_OWNER를 .env에 설정하세요}/pawmento-backend:${IMAGE_TAG:?IMAGE_TAG를 설정하세요}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GITHUB_OWNER:?GITHUB_OWNER를 .env에 설정하세요}/pawmento-frontend:${IMAGE_TAG:?IMAGE_TAG를 설정하세요}
    restart: unless-stopped

  # 팀 포트 하나로 받아 경로에 따라 프론트엔드와 백엔드로 나눈다 (nginx/develop.conf)
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEAM_PORT:?TEAM_PORT를 .env에 설정하세요}:80"
    volumes:
      - ./nginx/develop.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  db-data:
