# 개발 서버만의 설정. compose.yaml과 같은 폴더에 있으면 docker compose가 자동으로 합쳐 읽는다
# 값은 .env에서 읽는다 (.env.develop.example 참고)

services:
  nginx:
    # 밖으로 여는 포트는 팀에 배정된 TEAM_PORT 하나뿐이고, 127.0.0.1에만 연다. 호스트 nginx가 도메인으로 연결한다
    ports:
      - "127.0.0.1:${TEAM_PORT:?TEAM_PORT를 .env에 설정하세요}:80"
    volumes:
      - ./nginx/develop.conf:/etc/nginx/conf.d/default.conf:ro
